name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify docs files
        run: |
          test -f README.md
          test -f LICENSE
          test -f spikes/d1-application-framework.md
          test -f spikes/d8-social-providers.md
          test -f gates/g7-output-combinations.md
